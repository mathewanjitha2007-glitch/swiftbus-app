{% extends 'base.html' %}

{% block title %}SwiftBus - Add Bus{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 40px auto;">
    <div style="background: white; padding: 40px; border-radius: 12px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.1);">

        <div style="display: flex; align-items: center;
                    justify-content: space-between; margin-bottom: 30px;">
            <h2 style="color: #1a73e8;">🚌 Add New Bus</h2>
            <a href="/admin/buses" class="btn"
               style="background: #666; font-size: 13px; padding: 8px 16px;">
                ← Back
            </a>
        </div>

        <form action="/admin/buses/add" method="POST">

            <div style="display: flex; gap: 16px; margin-bottom: 18px;">
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">Bus Name</label>
                    <input type="text" name="bus_name" placeholder="e.g. Kerala Express" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">Bus Number</label>
                    <input type="text" name="bus_number" placeholder="e.g. KL-01-1234" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
            </div>

            <div style="display: flex; gap: 16px; margin-bottom: 18px;">
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">From City</label>
                    <input type="text" name="from_city" placeholder="e.g. Kochi" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">To City</label>
                    <input type="text" name="to_city" placeholder="e.g. Trivandrum" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
            </div>

            <div style="display: flex; gap: 16px; margin-bottom: 18px;">
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">Departure Time</label>
                    <input type="time" name="departure_time" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">Arrival Time</label>
                    <input type="time" name="arrival_time" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
            </div>

            <div style="display: flex; gap: 16px; margin-bottom: 18px;">
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">Travel Date</label>
                    <input type="date" name="travel_date" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 13px; color: #555;">Total Seats</label>
                    <input type="number" name="total_seats" placeholder="e.g. 40" required
                        style="width:100%; padding: 11px; margin-top: 6px;
                        border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
                </div>
            </div>

            <div style="margin-bottom: 28px;">
                <label style="font-size: 13px; color: #555;">Ticket Price (₹)</label>
                <input type="number" name="price" placeholder="e.g. 350" required
                    style="width:100%; padding: 11px; margin-top: 6px;
                    border: 1px solid #ddd; border-radius: 6px; font-size: 15px;">
            </div>

            <button type="submit" class="btn"
                    style="width:100%; padding: 13px; font-size: 16px;">
                🚌 Add Bus
            </button>
        </form>
    </div>
</div>
{% endblock %}
