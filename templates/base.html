<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SwiftBus{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
        nav {
            background: #1a73e8;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 { color: white; font-size: 24px; }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .btn {
            background: #1a73e8;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #1558b0; }
        .btn-red { background: #e53935; }
        .btn-red:hover { background: #b71c1c; }
        footer {
            text-align: center;
            padding: 20px;
            background: #1a73e8;
            color: white;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>🚌 SwiftBus</h1>
        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 12px 20px; margin-bottom: 16px; border-radius: 6px;
                        background: {% if category == 'success' %}#e6f4ea{% else %}#fce8e6{% endif %};
                        color: {% if category == 'success' %}#137333{% else %}#c5221f{% endif %};
                        border: 1px solid {% if category == 'success' %}#a8d5b5{% else %}#f5c6c6{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>© 2026 SwiftBus — Your Trusted Bus Booking Partner</p>
    </footer>
</body>
</html>
